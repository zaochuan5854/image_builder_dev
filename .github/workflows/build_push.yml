name: Build and Push Docker Image to DockerHub

on:
  pull_request:
    branches: ["main"]

  workflow_dispatch:
    inputs:
      docker_tag:
        description: "Docker image tag (e.g. latest, v1.2.3, dev)"
        required: true
        type: string
      docker_repo:
        description: "DockerHub repository name"
        required: true
        type: string
      overwrite:
        description: "Overwrite the existing DockerHub tag if it already exists"
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  build-and-push:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read

    env:
      DOCKER_USER: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKER_REPO: ${{ inputs.docker_repo }}
      DOCKER_TAG: ${{ inputs.docker_tag }}
      OVERWRITE: ${{ inputs.overwrite && '1' || '0' }}
      NTFY_URL: ${{ secrets.NTFY_URL }}
      PLATFORMS: ${{ vars.PLATFORMS || 'linux/amd64' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Send start notification with vars via ntfy.sh
        if: env.NTFY_URL != ''
        shell: bash
        run: |
          set -euo pipefail

          TITLE="Docker Build Started: ${{ github.repository }}"
          MESSAGE="Docker image build pipeline has been triggered. 🚀

          [Active Variables (vars)]
          ${{ toJSON(vars) }}"

          curl \
            -H "Title: $TITLE" \
            -H "Priority: 3" \
            -H "Tags: rocket,gear" \
            -d "$MESSAGE" \
            "$NTFY_URL"

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Ensure dependencies
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is required but not installed on this runner."
            exit 1
          fi

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$DOCKER_TAG" ]]; then
            echo "::error::Docker tag must not be empty."
            exit 1
          fi

          if [[ -z "$DOCKER_REPO" ]]; then
            echo "::error::DockerHub repository name must not be empty."
            exit 1
          fi

          if [[ ! "$DOCKER_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ ]]; then
            echo "::error::Invalid Docker tag: $DOCKER_TAG"
            exit 1
          fi

          if [[ ! "$DOCKER_REPO" =~ ^[a-z0-9][a-z0-9_.-]*$ ]]; then
            echo "::error::Invalid DockerHub repository name: $DOCKER_REPO"
            exit 1
          fi

      - name: Log in to DockerHub
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_USER }}/${{ env.DOCKER_REPO }}
          tags: |
            type=raw,value=${{ env.DOCKER_TAG }}

      - name: Check or delete existing duplicate tags
        if: github.event_name == 'workflow_dispatch'
        env:
          USERNAME: ${{ env.DOCKER_USER }}
          PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO_NAME: ${{ env.DOCKER_REPO }}
          TAG_TO_PUSH: ${{ env.DOCKER_TAG }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Authenticating with DockerHub API..."

          LOGIN_RES=$(curl -sS --fail-with-body -X POST \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"$USERNAME\", \"password\": \"$PASSWORD\"}" \
            https://hub.docker.com/v2/users/login/)

          TOKEN=$(echo "$LOGIN_RES" | jq -r '.token // empty')

          if [[ -z "$TOKEN" ]]; then
            echo "::error::Authentication failed. Token could not be extracted."
            exit 1
          fi

          echo "Checking if tag '$TAG_TO_PUSH' already exists on DockerHub..."

          CHECK_RES=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            "https://hub.docker.com/v2/repositories/$USERNAME/$REPO_NAME/tags/$TAG_TO_PUSH/")

          HTTP_CODE=$(echo "$CHECK_RES" | tail -n1)

          if [[ "$HTTP_CODE" == "200" ]]; then
            if [[ "$OVERWRITE" == "1" ]]; then
              echo "Tag exists and overwrite is enabled. Deleting existing tag..."

              DEL_RES=$(curl -sS -w "\n%{http_code}" -X DELETE \
                -H "Authorization: Bearer $TOKEN" \
                "https://hub.docker.com/v2/repositories/$USERNAME/$REPO_NAME/tags/$TAG_TO_PUSH/")

              DEL_HTTP_CODE=$(echo "$DEL_RES" | tail -n1)

              if [[ "$DEL_HTTP_CODE" != "204" &&
                    "$DEL_HTTP_CODE" != "200" &&
                    "$DEL_HTTP_CODE" != "202" ]]; then
                echo "::error::Failed to delete existing tag. HTTP Code: $DEL_HTTP_CODE"
                exit 1
              fi

              echo "::notice::Existing tag '$TAG_TO_PUSH' deleted."
            else
              echo "::error::Tag '$TAG_TO_PUSH' already exists and overwrite is disabled."
              exit 1
            fi
          elif [[ "$HTTP_CODE" == "404" ]]; then
            echo "Tag does not exist yet. Safe to push."
          else
            echo "::error::Unexpected DockerHub API status: $HTTP_CODE"
            exit 1
          fi


      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: true
          sbom: true

      - name: Push Docker image
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: true
          sbom: true

      - name: Generate Pull Commands Summary
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          echo "### 🚀 Pull Commands" >> "$GITHUB_STEP_SUMMARY"
          echo "Use the following command to pull the built image:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY

      - name: Send notification via ntfy.sh
        if: always() && env.NTFY_URL != ''
        shell: bash
        run: |
          set -euo pipefail

          STATUS="${{ job.status }}"
          TITLE="Docker Build: ${{ github.repository }}"

          if [[ "$STATUS" == "success" ]]; then
            TAGS="white_check_mark"
            PRIORITY="3"
            MESSAGE="Workflow build-and-push finished successfully. 🎉

          Pull Command:
          docker pull ${{ steps.meta.outputs.tags }}"
          else
            TAGS="x"
            PRIORITY="5"
            MESSAGE="Workflow build-and-push failed! ❌"
          fi

          curl \
            -H "Title: $TITLE" \
            -H "Priority: $PRIORITY" \
            -H "Tags: $TAGS" \
            -d "$MESSAGE" \
            "$NTFY_URL"
